apiVersion: v1
kind: Secret
metadata:
  name: rhdp-flow-api
type: Opaque
stringData:
  RHDP_API_KEY: ""   # set real value per environment (overlay patch or `oc set data`)
  SOUNDCHECK_API_KEY: ""  # Soundcheck X-API-Key for direct API access
  SOUNDCHECK_TOKEN: ""   # Bearer token for OAuth-proxied Soundcheck (takes precedence over API key)
