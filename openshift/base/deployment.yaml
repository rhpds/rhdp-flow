apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhdp-scheduler
  annotations:
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"rhdp-scheduler:latest"},
        "fieldPath":"spec.template.spec.containers[?(@.name==\"rhdp-scheduler\")].image"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rhdp-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rhdp-scheduler
    spec:
      serviceAccountName: rhdp-scheduler
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
      containers:
        - name: rhdp-scheduler
          image: rhdp-scheduler:latest
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: rhdp-scheduler-config
            - secretRef:
                # Keys loaded from rhdp-flow-api Secret (create/patch with oc set data):
                #   LABAGATOR_BASE_URL       — in-cluster Labagator service URL
                #   LABAGATOR_INTERNAL_API_KEY — shared secret for QA1 Confluence write-back;
                #                               must match internal_api_key in Labagator's
                #                               labagator-flow Secret (ansible/vars/*.yml)
                name: rhdp-flow-api
          env:
            - name: KUBECONFIG
              value: ""
            - name: AGNOSTICV_SSH_KEY_PATH
              value: "/etc/agnosticv-deploy-key/ssh-privatekey"
            # Schedules + results survive ImageStream rollouts (mounted PVC).
            - name: RHDP_FLOW_DATA_DIR
              value: "/app/data"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              memory: 512Mi
              cpu: 200m
            limits:
              memory: 2Gi
              cpu: "1"
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
            - name: agnosticv-deploy-key
              mountPath: /etc/agnosticv-deploy-key
              readOnly: true
      volumes:
        - name: logs
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: rhdp-scheduler-data
        - name: tmp
          emptyDir: {}
        - name: agnosticv-deploy-key
          secret:
            secretName: agnosticv-deploy-key
            defaultMode: 0400
