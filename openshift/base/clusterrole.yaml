apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rhdp-scheduler
rules:
  # Read namespaces for validation; create required for ensure-namespaces
  # (event-{id}-{DDMMYYYY} and other non-UserNamespace projects). Apply this
  # ClusterRole update before relying on POST /schedules/ensure-namespaces —
  # without create, Flow returns Forbidden and leaves missing namespaces failed.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create"]
  # Manage Babylon workshop resources (deploy creates, operations patch, cleanup deletes).
  # multiworkshops required for multi-asset / Asset_CIs rows (Roadshow, LB1577, etc.).
  - apiGroups: ["babylon.gpte.redhat.com"]
    resources: ["workshops", "workshopprovisions", "resourceclaims", "multiworkshops"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Read catalog items for num_users validation
  - apiGroups: ["babylon.gpte.redhat.com"]
    resources: ["catalogitems"]
    verbs: ["get", "list"]
