apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rhdp-scheduler
rules:
  # Read namespaces; patch/update to stamp user-uid=EVENT + display-name after ProjectRequest
  # (no bare Namespace create — use ProjectRequest)
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "patch", "update"]
  # Create session-block OpenShift projects (event-{id}-{DDMMYYYY}-{HHMM})
  - apiGroups: ["project.openshift.io"]
    resources: ["projectrequests"]
    verbs: ["create"]
  # Teardown empty event-* projects after Workshops are gone
  - apiGroups: ["project.openshift.io"]
    resources: ["projects"]
    verbs: ["get", "list", "delete"]
  # Manage Babylon workshop resources (deploy creates, scale, cleanup).
  # multiworkshops required for multi-asset / Asset_CIs rows (Roadshow, LB1577, etc.).
  - apiGroups: ["babylon.gpte.redhat.com"]
    resources:
      - workshops
      - workshopprovisions
      - resourceclaims
      - multiworkshops
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Read-only SelfPacedLab for QA (Labagator owns create/scale/flush).
  - apiGroups: ["babylon.gpte.redhat.com"]
    resources:
      - selfpacedlabs
      - selfpacedlabs/status
      - selfpacedlabprovisionitems
      - selfpacedlabprovisionitems/status
    verbs: ["get", "list"]
  # Read catalog items for num_users validation
  - apiGroups: ["babylon.gpte.redhat.com"]
    resources: ["catalogitems"]
    verbs: ["get", "list"]
