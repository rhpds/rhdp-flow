apiVersion: v1
kind: ConfigMap
metadata:
  name: rhdp-scheduler-config
data:
  LOG_FORMAT: "json"
  LOG_LEVEL: "INFO"
  RHDP_LOG_DIR: "/app/logs"
  # Writable PVC mount — schedules + deploy results survive rollouts
  RHDP_FLOW_DATA_DIR: "/app/data"

  # Space-separated list of origins allowed to frame Flow (CSP frame-ancestors).
  # Both the prod and dev Labagator routes embed this single Flow instance, so
  # both must be whitelisted or the dev embed is blocked by the browser.
  RHDP_FRAME_ANCESTORS: "https://labagator.apps.ocpv-infra01.dal12.infra.demo.redhat.com https://labagator-dev.apps.ocpv-infra01.dal12.infra.demo.redhat.com"
  AGNOSTICV_REPO_URL: "git@github.com:rhpds/agnosticv.git"
  AGNOSTICV_CACHE_DIR: "/tmp/agnosticv-cache"
  AGNOSTICV_REFRESH_TTL_SECONDS: "900"

  # Showroom Soundcheck base URL used for QA3 health checks.
  # Set per environment (overlay patch or `oc set data`).
  # Leave empty to fall back to the dev endpoint (not recommended for prod).
  SOUNDCHECK_URL: ""
